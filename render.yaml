services:
  - type: web
    name: omnifly-pro
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./data/pos.db
    disk:
      name: omnifly-data
      mountPath: /var/data
      sizeGB: 1
